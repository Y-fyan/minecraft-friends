# Minecraft Friends example. Matches ConfigLoader defaults.
# Offline by default. Select and configure a real provider explicitly before network use.
# Credentials belong only in the explicitly named environment variable, never in this file.
enabled=true
model.provider=mock
model.timeout-seconds=30
diagnostics.enabled=true
model.endpoint=
model.name=
model.api-key-env=
model.allow-unauthenticated-local=false
model.retries=1
model.max-context-messages=24
model.max-context-characters=12000
model.max-response-bytes=65536
