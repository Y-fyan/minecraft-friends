name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Java 21 / Fabric and Forge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check acceptance tools without external model calls
        run: |
          python3 -m unittest discover -s experiments/m1-acceptance -p 'test_*.py'
          python3 experiments/m1-acceptance/real_model_observer.py --endpoint http://127.0.0.1:1/v1/chat/completions --model self-test --api-key-env MF_SELF_TEST_UNUSED --self-test

      - name: Run tests and build both loaders
        run: ./gradlew checkAll --no-daemon --stacktrace

      - name: Verify resource-only rebuilds keep loader classes
        run: |
          ./gradlew checkAll -Pproject_version=0.1.0-incremental-check --no-daemon --stacktrace
          ./gradlew checkAll --no-daemon --stacktrace

      - name: Compile shared acceptance fixtures for both loaders (no game launch)
        run: ./gradlew -p experiments/m1-acceptance :fabric:compileJava :forge:compileJava --no-daemon --stacktrace

      - name: Upload installable JARs
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-friends-${{ github.sha }}
          path: build/artifacts/*.jar
          if-no-files-found: error
