name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Java 21 / Fabric and Forge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build both loaders
        run: ./gradlew checkAll --no-daemon --stacktrace

      - name: Upload installable JARs
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-friends-${{ github.sha }}
          path: build/artifacts/*.jar
          if-no-files-found: error
