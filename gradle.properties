# Toolchain and project metadata. Keep these versions pinned.
project_group=io.github.yfyan
project_version=0.1.0-SNAPSHOT
minecraft_version=1.21.1
java_version=21

# Fabric
fabric_loader_version=0.20.1
fabric_loom_version=1.7.4

# Minecraft Forge (not NeoForge)
forge_version=52.1.20
forge_gradle_version=6.0.24

# Shared test and logging dependencies
junit_version=5.11.4
slf4j_version=2.0.16

# ForgeGradle decompilation needs a larger heap than ordinary Gradle builds.
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.net.minecraftforge.gradle.repo.recompile.fork=true
systemProp.net.minecraftforge.gradle.repo.recompile.fork.args=-Xmx4G
