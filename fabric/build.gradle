plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

base {
    archivesName = "minecraft-friends-fabric-${minecraft_version}"
}

sourceSets {
    main {
        java.srcDir rootProject.file('common/src/main/java')
    }
}

loom {
    mods {
        minecraft_friends {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly "org.slf4j:slf4j-api:${slf4j_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'license', project_license
    inputs.property 'minecraft_version', minecraft_version

    filesMatching('fabric.mod.json') {
        expand version: project.version, license: project_license, minecraft_version: minecraft_version
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Specification-Title': 'minecraft_friends',
                'Specification-Version': '1',
                'Implementation-Title': 'Minecraft Friends Fabric',
                'Implementation-Version': project.version
        )
    }
}
