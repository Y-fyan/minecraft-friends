plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version "${forge_gradle_version}"
}

base {
    archivesName = "minecraft-friends-forge-${minecraft_version}"
}

sourceSets {
    main {
        java.srcDir rootProject.file('common/src/main/java')
    }
}

// Forge's development locator needs one directory containing metadata and classes.
// Keep production task outputs separate; only this Sync task owns the runtime copy.
def developmentModDirectory = layout.buildDirectory.dir('developmentMod')
def development = sourceSets.create('development')
development.java.setSrcDirs([])
development.resources.setSrcDirs([])
development.output.classesDirs.setFrom(developmentModDirectory)
development.runtimeClasspath = files(developmentModDirectory) +
        (sourceSets.main.runtimeClasspath - sourceSets.main.output)

def prepareDevelopmentMod = tasks.register('prepareDevelopmentMod', Sync) {
    dependsOn tasks.named('classes'), tasks.named(development.classesTaskName)
    from sourceSets.main.output
    into developmentModDirectory
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    reobf = false
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'eventbus.api.strictRuntimeChecks', 'true'
            mods {
                minecraft_friends { source development }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'minecraft_friends'
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'minecraft_friends'
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'minecraft_friends'
        }
    }
}

tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer'] }.configureEach {
    dependsOn prepareDevelopmentMod
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly "org.slf4j:slf4j-api:${slf4j_version}"
}

def resourceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: "[${minecraft_version}]",
        forge_version          : forge_version,
        forge_version_range    : '[52.1.20,)',
        loader_version_range   : '[52,)',
        mod_id                 : 'minecraft_friends',
        mod_name               : 'Minecraft Friends',
        mod_license            : project_license,
        mod_version            : project.version,
        mod_authors            : 'Y-fyan and contributors',
        mod_description        : 'AI companions for Minecraft Java Edition.'
]

tasks.named('processResources', ProcessResources) {
    inputs.properties resourceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand resourceProperties
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Specification-Title': 'minecraft_friends',
                'Specification-Version': '1',
                'Implementation-Title': 'Minecraft Friends Forge',
                'Implementation-Version': project.version
        )
    }
}
